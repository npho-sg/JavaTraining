<!DOCTYPE html>
<html th:replace="~{layout/app :: layout('料金情報検索', ~{::content}, 'charge')}">
<div th:fragment="content">

  <form th:action="@{/charge/search}" th:object="${chargeSearchForm}" method="POST">

    <div class="mb-3 row">
      <label class="col-sm-2 col-form-label" for="chargeName">料金名</label>
      <div class="col-sm-10">
        <input class="form-control" type="text" th:field="*{chargeName}" />
      </div>
    </div>
	
	<div class="mb-3 row">
	  <label class="col-sm-2 col-form-label" for="sortColumn">並び替え</label>
      <div class="col-sm-10 d-flex gap-3">
        <select class="form-control w-50" th:field="*{sortColumn}">
          <option value="1">料金ID</option>
          <option value="2">料金名</option>
          <option value="3">適用開始日</option>
          <option value="4">適用終了日</option>
        </select>
        <select class="form-control w-50" th:field="*{sortOperation}">
    	      <option value="up">昇順</option>
		  <option value="down">降順</option>
	    </select>
	  </div>
	</div>

    <div class="mb-3 row justify-content-between">
      <div class="col-auto">
        <button type="submit" class="btn btn-primary">検索</button>
        <a class="btn btn-link" th:href="@{/charge/add}">登録</a>
      </div>
    </div>
  </form>
</div>

</html>
