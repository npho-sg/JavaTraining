<!DOCTYPE html>
<html th:replace="~{layout/app :: layout('加入者検索', ~{::content}, 'member')}">
<div th:fragment="content">
  <!--/* 加入者情報検索画面 */-->
  <form th:action="@{/member/search}" th:object="${memberSearchCondition}" method="POST">
    <!--/* メールアドレス */-->
    <div class="mb-3 row">
      <label class="col-sm-2 col-form-label" for="mail">メールアドレス</label>
      <div class="col-sm-10">
        <input class="form-control" type="text" th:field="*{mail}" />
      </div>
    </div>
    <!--/* 氏名 */-->
    <!--/* ここにテキストフォームを設置 */-->
    <div class="mb-3 row">
      <label class="col-sm-2 col-form-label" for="name">氏名</label>
      <div class="col-sm-10">
        <input class="form-control" type="text" th:field="*{name}" />
      </div>
    </div>
	
	<div class="mb-3 row">
	  <label class="col-sm-2 col-form-label" for="sortColumn">並び替え</label>
	  <div class="col-sm-10 d-flex gap-3">
	    <select class="form-control w-50" th:field="*{sortColumn}">
	      <option value="memberId">加入者ID</option>
	      <option value="mail">メールアドレス</option>
	      <option value="name">氏名</option>
	      <option value="startDate">加入日</option>
	      <option value="modifiedAt">更新日</option>
	    </select>
	    <select class="form-control w-50" th:field="*{sortOperation}">
	      <option value="up">昇順</option>
	      <option value="down">降順</option>
	    </select>
	  </div>
	</div>
	
    <div class="mb-3 row justify-content-between">
      <div class="col-auto">
        <button type="submit" class="btn btn-primary">検索</button>
        <a class="btn btn-link" th:href="@{/member/add}">登録</a>
      </div>
    </div>
  </form>
</div>

</html>
